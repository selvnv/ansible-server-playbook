- name: Template static files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ nginx_static_root }}/{{ item.path }}"
    mode: "0644"
    owner: www-data
    group: www-data
  with_filetree: "{{ role_path }}/templates/{{ inventory_hostname }}/{{ nginx_instance }}/static"
  when: item.state == 'file'
