- name: Disable packaged nginx service to avoid port conflict
  ansible.builtin.systemd:
    name: nginx
    state: stopped
    enabled: false
    masked: true

- name: Deploy instance service
  ansible.builtin.template:
    src: "{{ inventory_hostname }}/systemd/nginx.service.j2"
    dest: "/etc/systemd/system/nginx.{{ nginx_instance }}.service"
    mode: "0644"
  notify: Verify configs and reload nginx

- name: Enable and start nginx instance
  ansible.builtin.systemd:
    name: "nginx.{{ nginx_instance }}"
    state: started
    enabled: true
    daemon_reload: true
