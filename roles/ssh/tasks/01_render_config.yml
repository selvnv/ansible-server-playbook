- name: Ensure sshd_config.d directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render main ssh config
  ansible.builtin.template:
    src: "{{ role_path }}/templates/sshd_config.j2"
    dest: "/etc/ssh/sshd_config"
    owner: root
    group: root
    mode: "0644"
    backup: true
    notify: Verify configs and reload ssh

- name: Render including ssh configs
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/ssh/sshd_config.d/{{ item.path | regex_replace('\\.j2$', '.conf') }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  with_filetree: "{{ role_path }}/templates/sshd_config.d"
  when: item.state == 'file' and item.path.endswith('.j2')
  notify: Verify configs and reload ssh
