- name: Collect public key files from catalog
  ansible.builtin.find:
    paths: "{{ role_path }}/files/{{ inventory_hostname }}/ssh_keys"
    patterns: "*.pub"
    file_type: file
    recurse: yes
  delegate_to: localhost
  become: false
  register: ssh_keys_found

- name: Deploy SSH public keys
  ansible.posix.authorized_key:
    user: "{{ item.path | dirname | basename }}"
    key: "{{ lookup('file', item.path) }}"
    state: present
    exclusive: false
  loop: "{{ ssh_keys_found.files }}"
