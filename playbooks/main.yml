- name: Run common role
  hosts:
    - production
  become: true
  roles:
    - common

- name: Run packages role
  hosts:
    - production
  become: true
  roles:
    - packages

- name: Run ssh role
  hosts:
    - production
  become: true
  roles:
    - ssh

- name: Run firewall role
  hosts:
    - production
  become: true
  roles:
    - firewall

- name: Run nginx role
  hosts:
    - production
  become: true
  roles:
    - nginx
